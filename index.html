<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>公費紀錄系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- 引入思源宋體 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-cream: #FDFBF7; 
            --lilac-primary: #B6A6D3; 
            --lilac-dark: #917FB3;
            --lilac-light: #EBE5F5;
            --text-main: #4A4A4A; 
        }
        body { 
            font-family: 'Noto Serif TC', serif; /* 套用思源宋體 */
            background-color: var(--bg-cream); 
            color: var(--text-main); 
            height: 100vh; 
            overflow: hidden; 
        }
        .input-std { 
            background: #FFFFFF; 
            border: 1px solid #EBE5F5; 
            border-radius: 12px; 
            padding: 12px 16px; 
            outline: none; 
            width: 100%; 
            transition: all 0.3s ease;
        }
        .input-std:focus {
            border-color: var(--lilac-primary);
            box-shadow: 0 0 0 3px rgba(182, 166, 211, 0.2);
        }
        [v-cloak] { display: none; }
    </style>
</head>
<body>
    <div id="app" v-cloak class="h-screen w-full flex flex-col max-w-3xl mx-auto shadow-2xl bg-white">
        
        <!-- 頂部標題列 -->
        <header class="bg-[#B6A6D3] text-white px-8 py-6 flex justify-between items-center shadow-md z-10 rounded-b-3xl">
            <h1 class="text-2xl font-bold tracking-wider"><i class="fa-solid fa-piggy-bank mr-2"></i> 公費紀錄</h1>
            <div class="text-sm font-medium opacity-80">{{ currentMonth }}</div>
        </header>

        <main class="flex-1 overflow-y-auto p-6 md:p-8 bg-[#FDFBF7]">
            <div class="space-y-8">
                
                <!-- 總計卡片 -->
                <div class="bg-white p-8 rounded-[2rem] shadow-sm border border-[#EBE5F5] text-center transform hover:scale-[1.01] transition-transform">
                    <div class="text-sm text-[#917FB3] font-bold tracking-widest mb-2">目前公費總額</div>
                    <div class="text-5xl font-bold text-[#4A4A4A]">$ {{ formatNumber(totalPublicFunds) }}</div>
                </div>

                <!-- 新增紀錄區塊 -->
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-[#EBE5F5] flex flex-col md:flex-row items-center gap-4">
                    <div class="px-4 py-2 bg-[#EBE5F5] text-[#917FB3] rounded-xl text-sm font-bold whitespace-nowrap">
                        <i class="fa-solid fa-plus mr-1"></i> 收入
                    </div>
                    <input type="date" v-model="form.date" class="input-std md:w-40">
                    <input type="text" v-model="form.item" placeholder="項目說明 (例: 班費收取)" class="input-std flex-1">
                    <input type="number" v-model.number="form.amount" placeholder="金額" class="input-std md:w-32 font-bold" @keyup.enter="submitForm">
                    
                    <button @click="submitForm" class="w-full md:w-14 h-12 md:h-14 bg-[#B6A6D3] text-white rounded-xl flex items-center justify-center hover:bg-[#917FB3] transition active:scale-95 shadow-md shadow-purple-100">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>

                <!-- 紀錄列表 -->
                <div class="bg-white rounded-3xl shadow-sm border border-[#EBE5F5] overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-[#FDFBF7] text-[#917FB3] text-xs uppercase tracking-widest font-bold border-b border-[#EBE5F5]">
                            <tr>
                                <th class="p-5">日期</th>
                                <th class="p-5">項目說明</th>
                                <th class="p-5 text-right">金額</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-[#EBE5F5]">
                            <tr v-for="entry in sortedEntries" :key="entry.id" class="hover:bg-[#FDFBF7]/50 transition">
                                <td class="p-5 text-[#917FB3] text-sm">{{ formatDateShort(entry.date) }}</td>
                                <td class="p-5 font-bold text-[#4A4A4A]">{{ entry.item }}</td>
                                <td class="p-5 text-right font-bold text-[#B6A6D3] text-lg">
                                    + {{ formatNumber(entry.amount) }}
                                </td>
                            </tr>
                            <tr v-if="sortedEntries.length === 0">
                                <td colspan="3" class="p-10 text-center text-[#917FB3] opacity-60">目前尚無公費紀錄</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase 與 Vue 邏輯 -->
    <script type="module">
        import { createApp, ref, computed, onMounted } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDVXmdKhCHkJGE1CdoIF0qfwhVbRRu4lT0",
            authDomain: "ossen-money-open.firebaseapp.com",
            projectId: "ossen-money-open",
            storageBucket: "ossen-money-open.firebasestorage.app",
            messagingSenderId: "737552427070",
            appId: "1:737552427070:web:c9b2f4b30f8075cfc8496f",
            measurementId: "G-BVWVJC7R3T"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        createApp({
            setup() {
                const currentMonth = ref(new Date().toISOString().slice(0, 7).replace('-', ' 年 ') + ' 月');
                const transactions = ref([]);
                
                const form = ref({ 
                    date: new Date().toISOString().split('T')[0], 
                    amount: '', 
                    item: '' 
                });

                onMounted(() => {
                    const q = query(collection(db, "public_funds"), orderBy("createdAt", "desc"));
                    onSnapshot(q, (snap) => { 
                        transactions.value = snap.docs.map(d => ({ ...d.data(), id: d.id })); 
                    });
                });

                const sortedEntries = computed(() => transactions.value);
                const totalPublicFunds = computed(() => transactions.value.reduce((sum, current) => sum + current.amount, 0));

                const submitForm = async () => { 
                    if (!form.value.item || !form.value.amount) return;
                    try { 
                        await addDoc(collection(db, "public_funds"), { 
                            date: form.value.date,
                            amount: Number(form.value.amount),
                            item: form.value.item,
                            createdAt: new Date().getTime()
                        }); 
                        form.value.amount = ''; 
                        form.value.item = ''; 
                    } catch(e) { 
                        alert("儲存失敗，請檢查權限"); 
                    } 
                };

                const formatNumber = (num) => new Intl.NumberFormat().format(num || 0);
                const formatDateShort = (s) => { const d = new Date(s); return `${d.getMonth()+1}/${d.getDate()}`; };

                return { currentMonth, sortedEntries, form, totalPublicFunds, submitForm, formatNumber, formatDateShort };
            }
        }).mount('#app');
    </script>
</body>
</html>
