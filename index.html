<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>公費紀錄系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-cream: #FDFBF7; --lilac-primary: #B6A6D3; --text-main: #4A4A4A; }
        body { font-family: 'Noto Serif TC', serif; background-color: var(--bg-cream); color: var(--text-main); height: 100vh; overflow: hidden; }
        .input-std { background: #FFFFFF; border: 1px solid #EBE5F5; border-radius: 12px; padding: 12px 16px; outline: none; width: 100%; transition: all 0.3s ease; }
        .input-std:focus { border-color: var(--lilac-primary); box-shadow: 0 0 0 3px rgba(182, 166, 211, 0.2); }
        [v-cloak] { display: none; }
    </style>
</head>
<body>
    <div id="app" v-cloak class="h-screen w-full flex flex-col max-w-4xl mx-auto shadow-2xl bg-white relative">
        
        <!-- 頂部標題與月份切換 -->
        <header class="bg-[#B6A6D3] text-white px-6 py-5 flex justify-between items-center shadow-md z-10 rounded-b-3xl">
            <h1 class="text-xl md:text-2xl font-bold tracking-wider"><i class="fa-solid fa-piggy-bank mr-2"></i> 公費紀錄</h1>
            
            <div class="flex items-center gap-3 bg-white/20 rounded-xl px-2 py-1">
                <button @click="changeMonth(-1)" class="p-2 hover:bg-white/20 rounded-lg transition"><i class="fa-solid fa-chevron-left"></i></button>
                <input type="month" v-model="currentMonth" class="bg-transparent text-center font-bold text-white outline-none cursor-pointer w-28 md:w-32">
                <button @click="changeMonth(1)" class="p-2 hover:bg-white/20 rounded-lg transition"><i class="fa-solid fa-chevron-right"></i></button>
            </div>

            <button @click="showSettings = true" class="p-2 hover:bg-white/20 rounded-lg transition text-xl"><i class="fa-solid fa-gear"></i></button>
        </header>

        <main class="flex-1 overflow-y-auto p-4 md:p-8 bg-[#FDFBF7]">
            <div class="space-y-6">
                
                <!-- 總計卡片 -->
                <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-[#EBE5F5] text-center">
                    <div class="text-sm text-[#917FB3] font-bold tracking-widest mb-2">總資產結餘 (含初始金額)</div>
                    <div class="text-4xl md:text-5xl font-bold text-[#4A4A4A]">$ {{ formatNumber(totalPublicFunds) }}</div>
                </div>

                <!-- 新增紀錄區塊 -->
                <div class="bg-white p-4 md:p-6 rounded-3xl shadow-sm border border-[#EBE5F5] flex flex-wrap items-center gap-3">
                    <input type="date" v-model="form.date" class="input-std w-full md:w-auto">
                    <div class="flex flex-1 gap-3">
                        <input type="text" v-model="form.item" placeholder="項目說明 (例: 班費)" class="input-std w-full">
                        <input type="number" v-model.number="form.amount" placeholder="金額 (-支出/+收入)" class="input-std w-32 font-bold" @keyup.enter="submitForm">
                    </div>
                    <button @click="submitForm" class="w-full md:w-14 h-12 md:h-12 bg-[#B6A6D3] text-white rounded-xl flex items-center justify-center hover:bg-[#917FB3] transition active:scale-95 shadow-md">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>

                <!-- 當月紀錄列表 -->
                <div class="bg-white rounded-3xl shadow-sm border border-[#EBE5F5] overflow-hidden">
                    <div class="p-4 bg-[#FDFBF7] border-b border-[#EBE5F5] text-[#917FB3] font-bold text-sm tracking-widest">{{ currentMonth.replace('-', ' 年 ') }} 月紀錄</div>
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-gray-50 text-gray-400 text-xs uppercase tracking-widest hidden md:table-header-group">
                            <tr>
                                <th class="p-4">日期</th>
                                <th class="p-4">項目說明</th>
                                <th class="p-4 text-right">金額</th>
                                <th class="p-4 text-center w-24">操作</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-[#EBE5F5]">
                            <tr v-for="entry in filteredEntries" :key="entry.id" class="hover:bg-[#FDFBF7]/50 transition flex flex-col md:table-row p-4 md:p-0">
                                <td class="md:p-4 text-[#917FB3] text-sm md:text-base mb-1 md:mb-0">{{ formatDateShort(entry.date) }}</td>
                                <td class="md:p-4 font-bold text-[#4A4A4A] text-lg md:text-base mb-2 md:mb-0">{{ entry.item }}</td>
                                <td :class="['md:p-4 text-left md:text-right font-bold text-xl md:text-lg mb-3 md:mb-0', entry.amount >= 0 ? 'text-[#B6A6D3]' : 'text-[#D4A5A5]']">
                                    {{ entry.amount > 0 ? '+' : '' }} {{ formatNumber(entry.amount) }}
                                </td>
                                <td class="md:p-4 text-left md:text-center space-x-3">
                                    <button @click="openEdit(entry)" class="text-gray-400 hover:text-blue-500 transition"><i class="fa-solid fa-pen"></i></button>
                                    <button @click="deleteEntry(entry.id)" class="text-gray-400 hover:text-red-500 transition"><i class="fa-solid fa-trash"></i></button>
                                </td>
                            </tr>
                            <tr v-if="filteredEntries.length === 0">
                                <td colspan="4" class="p-10 text-center text-[#917FB3] opacity-60">此月份尚無紀錄</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <!-- 修改紀錄 Modal -->
        <div v-if="showEditModal" class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
            <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl">
                <h3 class="text-xl font-bold text-[#4A4A4A] mb-4">修改紀錄</h3>
                <div class="space-y-3">
                    <input type="date" v-model="editForm.date" class="input-std">
                    <input type="text" v-model="editForm.item" class="input-std">
                    <input type="number" v-model.number="editForm.amount" class="input-std font-bold">
                </div>
                <div class="flex gap-3 mt-6">
                    <button @click="showEditModal = false" class="flex-1 py-3 bg-gray-100 text-gray-500 rounded-xl font-bold">取消</button>
                    <button @click="submitEdit" class="flex-1 py-3 bg-[#B6A6D3] text-white rounded-xl font-bold">儲存</button>
                </div>
            </div>
        </div>

        <!-- 設定 Modal (初始金額) -->
        <div v-if="showSettings" class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
            <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl">
                <h3 class="text-xl font-bold text-[#4A4A4A] mb-4"><i class="fa-solid fa-gear mr-2 text-[#B6A6D3]"></i>系統設定</h3>
                <label class="text-sm text-[#917FB3] font-bold mb-1 block">設定初始金額起點</label>
                <input type="number" v-model.number="tempInitialBalance" class="input-std font-bold text-xl text-center mb-6">
                <div class="flex gap-3">
                    <button @click="showSettings = false" class="flex-1 py-3 bg-gray-100 text-gray-500 rounded-xl font-bold">取消</button>
                    <button @click="saveSettings" class="flex-1 py-3 bg-[#B6A6D3] text-white rounded-xl font-bold">儲存設定</button>
                </div>
            </div>
        </div>

    </div>

    <script type="module">
        import { createApp, ref, computed, onMounted } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, deleteDoc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDVXmdKhCHkJGE1CdoIF0qfwhVbRRu4lT0",
            authDomain: "ossen-money-open.firebaseapp.com",
            projectId: "ossen-money-open",
            storageBucket: "ossen-money-open.firebasestorage.app",
            messagingSenderId: "737552427070",
            appId: "1:737552427070:web:c9b2f4b30f8075cfc8496f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        createApp({
            setup() {
                const currentMonth = ref(new Date().toISOString().slice(0, 7));
                const transactions = ref([]);
                
                // 初始金額設定
                const initialBalance = ref(6786);
                const tempInitialBalance = ref(6786);
                
                const showSettings = ref(false);
                const showEditModal = ref(false);
                
                const form = ref({ date: new Date().toISOString().split('T')[0], amount: '', item: '' });
                const editForm = ref({ id: '', date: '', amount: '', item: '' });

                onMounted(() => {
                    // 讀取所有紀錄
                    const q = query(collection(db, "public_funds"), orderBy("createdAt", "desc"));
                    onSnapshot(q, (snap) => { 
                        transactions.value = snap.docs.map(d => ({ ...d.data(), id: d.id })); 
                    });

                    // 讀取初始金額設定
                    onSnapshot(doc(db, "settings", "public"), (d) => {
                        if (d.exists()) {
                            initialBalance.value = d.data().initialBalance;
                            tempInitialBalance.value = d.data().initialBalance;
                        }
                    });
                });

                // 過濾出「當月」的紀錄
                const filteredEntries = computed(() => {
                    return transactions.value.filter(t => t.date.startsWith(currentMonth.value));
                });

                // 計算「總資產」: 初始金額 + 雲端所有紀錄的加總
                const totalPublicFunds = computed(() => {
                    const recordsSum = transactions.value.reduce((sum, current) => sum + current.amount, 0);
                    return initialBalance.value + recordsSum;
                });

                const changeMonth = (offset) => {
                    const d = new Date(currentMonth.value + "-01");
                    d.setMonth(d.getMonth() + offset);
                    currentMonth.value = d.toISOString().slice(0, 7);
                };

                const saveSettings = async () => {
                    await setDoc(doc(db, "settings", "public"), { initialBalance: tempInitialBalance.value });
                    showSettings.value = false;
                };

                const submitForm = async () => { 
                    if (!form.value.item || !form.value.amount) return;
                    try { 
                        await addDoc(collection(db, "public_funds"), { 
                            date: form.value.date,
                            amount: Number(form.value.amount),
                            item: form.value.item,
                            createdAt: new Date(form.value.date).getTime()
                        }); 
                        form.value.amount = ''; form.value.item = ''; 
                    } catch(e) { alert("儲存失敗"); } 
                };

                const openEdit = (entry) => {
                    editForm.value = { ...entry };
                    showEditModal.value = true;
                };

                const submitEdit = async () => {
                    await updateDoc(doc(db, "public_funds", editForm.value.id), {
                        date: editForm.value.date,
                        item: editForm.value.item,
                        amount: Number(editForm.value.amount),
                        createdAt: new Date(editForm.value.date).getTime()
                    });
                    showEditModal.value = false;
                };

                const deleteEntry = async (id) => {
                    if(confirm("確定要刪除這筆紀錄嗎？")) {
                        await deleteDoc(doc(db, "public_funds", id));
                    }
                };

                const formatNumber = (num) => new Intl.NumberFormat().format(num || 0);
                const formatDateShort = (s) => { const d = new Date(s); return `${d.getMonth()+1}/${d.getDate().toString().padStart(2, '0')}`; };

                return { 
                    currentMonth, filteredEntries, form, editForm, 
                    totalPublicFunds, tempInitialBalance, showSettings, showEditModal, 
                    changeMonth, saveSettings, submitForm, openEdit, submitEdit, deleteEntry, 
                    formatNumber, formatDateShort 
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
